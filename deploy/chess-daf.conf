# Included only inside jooflow.space's existing TLS server block.
location = /chess-daf { return 308 /chess-daf/; }

location = /_chess_daf_auth {
    internal;
    proxy_pass http://127.0.0.1:8787/api/health;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
}

location @chess_daf_login { return 303 /login; }

location ^~ /chess-daf/ {
    if ($host = www.jooflow.space) { return 308 https://jooflow.space$request_uri; }
    auth_request /_chess_daf_auth;
    error_page 401 = @chess_daf_login;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18971/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Chess-User owner;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_cache off;
    add_header Cache-Control no-store always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
