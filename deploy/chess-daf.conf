# Included only inside jooflow.space's existing TLS server block.
location = /chess-daf { return 308 /chess-daf/; }

location ^~ /chess-daf/ {
    if ($host = www.jooflow.space) { return 308 https://jooflow.space$request_uri; }
    limit_req zone=daf_pages burst=100 nodelay;
    limit_req zone=daf_write burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18971/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Chess-User "";
    proxy_set_header Cookie "chess_daf_guest=$cookie_chess_daf_guest";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_cache off;
    add_header Cache-Control no-store always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
