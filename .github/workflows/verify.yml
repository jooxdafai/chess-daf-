name: Verify Chess DAF
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stockfish
      - run: python -m pip install -r requirements.txt pytest==9.2.0
      - run: python -m pytest -q
      - run: node --check web/static/app.js
      - run: node --test tests/premove-unit.mjs
      - run: git diff --check
